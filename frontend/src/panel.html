<p-toast class="gateway-toast" position="top-right" [life]="5500" />
<header class="mast">
  <div class="frame mast-inner">
    <div class="brand">
      <img src="hearth.svg" alt="" width="36" height="36" /><span>Hestia</span>
    </div>
    <span class="mast-note">Панель шлюза</span>
  </div>
</header>
<div class="nav-band">
  <nav class="frame nav" aria-label="Основная навигация">
    @for (page of pages; track page.path) {
      <a
        [routerLink]="['/', page.path]"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        >{{ page.label }}</a
      >
    }
    @if (grafanaUrl(); as url) {
      <span class="external-nav">
        <span class="external-label">Внешние сервисы</span>
        <a [href]="url" target="_blank" rel="noopener noreferrer"
          >Grafana <span aria-hidden="true">↗</span
          ><span class="sr-only"> (в новой вкладке)</span></a
        >
      </span>
    }
  </nav>
</div>
<main class="frame"><router-outlet /></main>
