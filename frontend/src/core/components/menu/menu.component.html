@if (overlayOpen()) {
  <button
    type="button"
    class="menu-backdrop"
    tabindex="-1"
    aria-label="Закрыть меню"
    (click)="closeOverlay(trigger)"
  ></button>
}
<aside
  tabindex="-1"
  class="sidebar"
  [cdkTrapFocus]="overlayOpen()"
  [class.open]="expanded()"
  (keydown.escape)="setExpanded(false); trigger.focus()"
>
  <nav id="gateway-menu" class="rail" aria-label="Основная навигация">
    @for (page of pages; track page.path) {
      <a
        [routerLink]="['/', page.path]"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        [attr.aria-label]="page.label"
        [pTooltip]="page.label"
        [tooltipDisabled]="expanded()"
        tooltipEvent="both"
        tooltipPosition="right"
        (click)="closeOverlay(trigger)"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path [attr.d]="icons[page.path]" /></svg
        ><span>{{ page.label }}</span>
      </a>
    }
    @if (grafanaUrl(); as url) {
      <a
        [href]="url"
        (click)="closeOverlay(trigger)"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Grafana (в новой вкладке)"
        pTooltip="Открыть Grafana"
        tooltipEvent="both"
        >↗<span>Grafana</span></a
      >
    }
  </nav>
  <button
    #trigger
    pButton
    type="button"
    class="menu-trigger"
    aria-controls="gateway-menu"
    [attr.aria-expanded]="expanded()"
    [attr.aria-label]="toggleLabel()"
    [pTooltip]="toggleLabel()"
    tooltipEvent="both"
    tooltipPosition="right"
    (click)="setExpanded(!expanded())"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg
    ><span>Свернуть меню</span>
  </button>
</aside>
