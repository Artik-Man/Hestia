components:
  schemas:
    AppliedBinding:
      additionalProperties: false
      properties:
        group:
          type: string
        listId:
          type: string
      required:
        - listId
        - group
      type: object
    AppliedOrder:
      additionalProperties: false
      properties:
        groups:
          items:
            $ref: "#/components/schemas/OrderedGroup"
          type: array
      required:
        - groups
      type: object
    BindingChange:
      additionalProperties: false
      properties:
        expectedGroup:
          type: string
        group:
          type: string
        listId:
          minLength: 1
          type: string
      required:
        - listId
        - expectedGroup
        - group
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          nullable: true
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          example: https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          example: 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          example: Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          example: https://example.com/errors/example
          format: uri
          type: string
      type: object
    Exit:
      additionalProperties: false
      properties:
        available:
          type: boolean
        id:
          type: string
      required:
        - id
        - available
      type: object
    Group:
      additionalProperties: false
      properties:
        exits:
          items:
            $ref: "#/components/schemas/Exit"
          type: array
        id:
          type: string
        isDefault:
          type: boolean
      required:
        - id
        - isDefault
        - exits
      type: object
    GroupOrderChange:
      additionalProperties: false
      properties:
        expected:
          items:
            $ref: "#/components/schemas/OrderedGroup"
          minItems: 1
          type: array
        groups:
          items:
            $ref: "#/components/schemas/OrderedGroup"
          minItems: 1
          type: array
      required:
        - expected
        - groups
      type: object
    Navigation:
      additionalProperties: false
      properties:
        grafanaUrl:
          description: Адрес Grafana по HTTPS или пустая строка, если интеграция выключена
          type: string
      required:
        - grafanaUrl
      type: object
    OrderedGroup:
      additionalProperties: false
      properties:
        exits:
          items:
            type: string
          type: array
        id:
          minLength: 1
          type: string
      required:
        - id
        - exits
      type: object
    RuleList:
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        group:
          description: Пустая строка означает отсутствие привязки
          type: string
        id:
          type: string
        masks:
          items:
            type: string
          type: array
      required:
        - id
        - group
        - enabled
        - masks
      type: object
    Snapshot:
      additionalProperties: false
      properties:
        groups:
          items:
            $ref: "#/components/schemas/Group"
          type: array
        lists:
          items:
            $ref: "#/components/schemas/RuleList"
          type: array
      required:
        - groups
        - lists
      type: object
info:
  title: Локальная панель Гестии
  version: 1.0.0
openapi: 3.0.3
paths:
  /api/group-order:
    put:
      operationId: applyGroupOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupOrderChange"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppliedOrder"
          description: OK
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Request Entity Too Large
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Применить порядок групп и подключений
      tags:
        - Panel
  /api/groups-and-rules:
    get:
      operationId: getGroupsAndRules
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Прочитать проверенный снимок групп и доменных списков
      tags:
        - Panel
  /api/list-binding:
    put:
      operationId: applyListBinding
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindingChange"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppliedBinding"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Применить привязку доменного списка
      tags:
        - Panel
  /api/navigation:
    get:
      operationId: getNavigation
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Navigation"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Прочитать настройки внешних ссылок панели
      tags:
        - Panel
servers:
  - url: /
