components:
  schemas:
    AWGCheckRequest:
      additionalProperties: false
      properties:
        profile:
          minLength: 1
          type: string
      required:
        - profile
      type: object
    AWGCheckResult:
      additionalProperties: false
      properties:
        message:
          type: string
        routeReady:
          type: boolean
        status:
          enum:
            - handshake_confirmed
          type: string
      required:
        - status
        - message
        - routeReady
      type: object
    AWGConnection:
      additionalProperties: false
      properties:
        group:
          minLength: 1
          type: string
        id:
          minLength: 1
          type: string
        ipv6Blocked:
          type: boolean
        priority:
          format: int64
          minimum: 1
          type: integer
        status:
          enum:
            - configured
            - checking
            - ready
            - error
          type: string
      required:
        - id
        - group
        - priority
        - status
        - ipv6Blocked
      type: object
    AWGSaveRequest:
      additionalProperties: false
      properties:
        group:
          minLength: 1
          type: string
        id:
          minLength: 1
          type: string
        priority:
          format: int64
          minimum: 1
          type: integer
        profile:
          minLength: 1
          type: string
      required:
        - id
        - group
        - priority
        - profile
      type: object
    AWGUpdateRequest:
      additionalProperties: false
      properties:
        group:
          minLength: 1
          type: string
        priority:
          format: int64
          minimum: 1
          type: integer
        profile:
          minLength: 1
          type: string
      required:
        - group
        - priority
        - profile
      type: object
    AppliedBinding:
      additionalProperties: false
      properties:
        group:
          type: string
        listId:
          type: string
      required:
        - listId
        - group
      type: object
    AppliedOrder:
      additionalProperties: false
      properties:
        groups:
          items:
            $ref: "#/components/schemas/OrderedGroup"
          type: array
      required:
        - groups
      type: object
    BindingChange:
      additionalProperties: false
      properties:
        expectedGroup:
          type: string
        group:
          type: string
        listId:
          minLength: 1
          type: string
      required:
        - listId
        - expectedGroup
        - group
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          nullable: true
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          example: https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          example: 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          example: Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          example: https://example.com/errors/example
          format: uri
          type: string
      type: object
    Exit:
      additionalProperties: false
      properties:
        available:
          type: boolean
        id:
          type: string
      required:
        - id
        - available
      type: object
    Group:
      additionalProperties: false
      properties:
        exits:
          items:
            $ref: "#/components/schemas/Exit"
          type: array
        id:
          type: string
        isDefault:
          type: boolean
      required:
        - id
        - isDefault
        - exits
      type: object
    GroupOrderChange:
      additionalProperties: false
      properties:
        expected:
          items:
            $ref: "#/components/schemas/OrderedGroup"
          minItems: 1
          type: array
        groups:
          items:
            $ref: "#/components/schemas/OrderedGroup"
          minItems: 1
          type: array
      required:
        - expected
        - groups
      type: object
    Navigation:
      additionalProperties: false
      properties:
        grafanaUrl:
          description: Адрес Grafana по HTTPS или пустая строка, если интеграция выключена
          type: string
      required:
        - grafanaUrl
      type: object
    OrderedGroup:
      additionalProperties: false
      properties:
        exits:
          items:
            type: string
          type: array
        id:
          minLength: 1
          type: string
      required:
        - id
        - exits
      type: object
    RuleList:
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        group:
          description: Пустая строка означает отсутствие привязки
          type: string
        id:
          type: string
        masks:
          items:
            type: string
          type: array
      required:
        - id
        - group
        - enabled
        - masks
      type: object
    Snapshot:
      additionalProperties: false
      properties:
        groups:
          items:
            $ref: "#/components/schemas/Group"
          type: array
        lists:
          items:
            $ref: "#/components/schemas/RuleList"
          type: array
      required:
        - groups
        - lists
      type: object
info:
  title: Локальная панель Гестии
  version: 1.0.0
openapi: 3.0.3
paths:
  /api/awg:
    get:
      operationId: listAWGConnections
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/AWGConnection"
                type: array
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Прочитать подключения AmneziaWG без секретных данных
      tags:
        - Panel
    post:
      operationId: createAWGConnection
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AWGSaveRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AWGConnection"
          description: OK
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Request Entity Too Large
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Сохранить профиль AmneziaWG и назначение группе
      tags:
        - Panel
  /api/awg/check:
    post:
      operationId: checkAWGProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AWGCheckRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AWGCheckResult"
          description: OK
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Request Entity Too Large
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Проверить временный профиль AmneziaWG без сохранения
      tags:
        - Panel
  /api/awg/{id}:
    delete:
      operationId: deleteAWGConnection
      parameters:
        - in: path
          name: id
          required: true
          schema:
            minLength: 1
            type: string
      responses:
        "204":
          description: No Content
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Удалить подключение AmneziaWG
      tags:
        - Panel
    put:
      operationId: updateAWGConnection
      parameters:
        - in: path
          name: id
          required: true
          schema:
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AWGUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AWGConnection"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Обновить сохранённое подключение AmneziaWG
      tags:
        - Panel
  /api/group-order:
    put:
      operationId: applyGroupOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupOrderChange"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppliedOrder"
          description: OK
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Request Entity Too Large
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Применить порядок групп и подключений
      tags:
        - Panel
  /api/groups-and-rules:
    get:
      operationId: getGroupsAndRules
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Прочитать проверенный снимок групп и доменных списков
      tags:
        - Panel
  /api/list-binding:
    put:
      operationId: applyListBinding
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindingChange"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppliedBinding"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Применить привязку доменного списка
      tags:
        - Panel
  /api/navigation:
    get:
      operationId: getNavigation
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Navigation"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Прочитать настройки внешних ссылок панели
      tags:
        - Panel
servers:
  - url: /
