components:
  schemas:
    AWGCheckRequest:
      additionalProperties: false
      properties:
        profile:
          minLength: 1
          type: string
      required:
        - profile
      type: object
    AWGCheckResult:
      additionalProperties: false
      properties:
        message:
          type: string
        routeReady:
          type: boolean
        status:
          enum:
            - handshake_confirmed
          type: string
      required:
        - status
        - message
        - routeReady
      type: object
    AWGConnection:
      additionalProperties: false
      properties:
        activeUnderlay:
          type: string
        group:
          minLength: 1
          type: string
        id:
          minLength: 1
          type: string
        ipv6Blocked:
          type: boolean
        priority:
          format: int64
          minimum: 1
          type: integer
        status:
          enum:
            - configured
            - checking
            - ready
            - error
          type: string
        underlays:
          items:
            type: string
          maxItems: 64
          type: array
      required:
        - id
        - group
        - priority
        - status
        - ipv6Blocked
      type: object
    AWGConnectionProfile:
      additionalProperties: false
      properties:
        group:
          minLength: 1
          type: string
        id:
          minLength: 1
          type: string
        priority:
          format: int64
          minimum: 1
          type: integer
        profile:
          minLength: 1
          type: string
        underlays:
          description: Идентификаторы выходов в порядке предпочтения; пустой список — обычный маршрут
          items:
            type: string
          maxItems: 64
          type: array
      required:
        - id
        - group
        - priority
        - profile
      type: object
    AWGSaveRequest:
      additionalProperties: false
      properties:
        group:
          minLength: 1
          type: string
        id:
          minLength: 1
          type: string
        priority:
          format: int64
          minimum: 1
          type: integer
        profile:
          minLength: 1
          type: string
        underlays:
          description: Идентификаторы выходов в порядке предпочтения; пустой список — обычный маршрут
          items:
            type: string
          maxItems: 64
          type: array
      required:
        - id
        - group
        - profile
      type: object
    AWGUnderlayCandidate:
      additionalProperties: false
      properties:
        id:
          minLength: 1
          type: string
        name:
          maxLength: 80
          type: string
        type:
          enum:
            - direct
            - wireguard
            - amneziawg
          type: string
      required:
        - id
        - type
      type: object
    AWGUpdateRequest:
      additionalProperties: false
      properties:
        group:
          minLength: 1
          type: string
        priority:
          format: int64
          minimum: 1
          type: integer
        profile:
          minLength: 1
          type: string
        underlays:
          description: Идентификаторы выходов в порядке предпочтения; пустой список — обычный маршрут
          items:
            type: string
          maxItems: 64
          type: array
      required:
        - profile
      type: object
    AppliedBinding:
      additionalProperties: false
      properties:
        group:
          type: string
        listId:
          type: string
      required:
        - listId
        - group
      type: object
    AppliedOrder:
      additionalProperties: false
      properties:
        groups:
          items:
            $ref: "#/components/schemas/OrderedGroup"
          type: array
      required:
        - groups
      type: object
    BindingChange:
      additionalProperties: false
      properties:
        expectedGroup:
          type: string
        group:
          type: string
        listId:
          minLength: 1
          type: string
      required:
        - listId
        - expectedGroup
        - group
      type: object
    CheckResult:
      additionalProperties: false
      properties:
        localErrors:
          format: int64
          type: integer
        protocol:
          enum:
            - UDP
            - TCP
            - ICMP
            - DNS
            - HTTPS
            - HTTP3
          type: string
        samples:
          format: int64
          type: integer
        score:
          format: double
          nullable: true
          type: number
        successes:
          format: int64
          type: integer
        targets:
          items:
            $ref: "#/components/schemas/TargetResult"
          type: array
      required:
        - protocol
        - samples
        - successes
        - localErrors
        - score
        - targets
      type: object
    DNSClientUDP:
      additionalProperties: false
      properties:
        attempts:
          format: int64
          minimum: 0
          type: integer
        retriedAttempts:
          format: int64
          minimum: 0
          type: integer
        unclassifiedAttempts:
          format: int64
          minimum: 0
          type: integer
      required:
        - unclassifiedAttempts
        - attempts
        - retriedAttempts
      type: object
    DNSPolicySnapshot:
      additionalProperties: false
      properties:
        policy:
          $ref: "#/components/schemas/Policy"
        revision:
          format: int64
          minimum: 0
          type: integer
      required:
        - revision
        - policy
      type: object
    DNSPolicyUpdate:
      additionalProperties: false
      properties:
        expectedRevision:
          format: int64
          minimum: 0
          type: integer
        policy:
          $ref: "#/components/schemas/Policy"
      required:
        - expectedRevision
        - policy
      type: object
    DNSSettings:
      additionalProperties: false
      properties:
        automaticEnabled:
          type: boolean
        intervalMinutes:
          format: int64
          maximum: 525600
          minimum: 1
          type: integer
        retentionSeconds:
          format: int64
          maximum: 31536000
          minimum: 0
          type: integer
        serveStale:
          type: boolean
        staleWindowSeconds:
          format: int64
          maximum: 31536000
          minimum: 0
          type: integer
        threshold:
          format: int64
          maximum: 1000000
          minimum: 1
          type: integer
        windowHours:
          format: int64
          maximum: 8760
          minimum: 1
          type: integer
      required:
        - retentionSeconds
        - serveStale
        - staleWindowSeconds
        - automaticEnabled
        - threshold
        - windowHours
        - intervalMinutes
      type: object
    DNSWarmName:
      additionalProperties: false
      properties:
        clientRequests:
          format: int64
          minimum: 1
          type: integer
        domain:
          maxLength: 253
          minLength: 1
          type: string
      required:
        - domain
        - clientRequests
      type: object
    DNSWarmReport:
      additionalProperties: false
      properties:
        automatic:
          items:
            $ref: "#/components/schemas/DNSWarmName"
          type: array
        clientUdp:
          $ref: "#/components/schemas/DNSClientUDP"
        observedAt:
          format: date-time
          type: string
        policyRevision:
          format: int64
          minimum: 0
          type: integer
      required:
        - observedAt
        - policyRevision
        - automatic
      type: object
    DomainListUpdate:
      additionalProperties: false
      properties:
        expected:
          $ref: "#/components/schemas/RuleList"
        list:
          $ref: "#/components/schemas/DomainListValues"
      required:
        - expected
        - list
      type: object
    DomainListValues:
      additionalProperties: false
      properties:
        group:
          description: Пустая строка означает отсутствие привязки
          maxLength: 63
          type: string
        masks:
          items:
            type: string
          maxItems: 1024
          type: array
        name:
          maxLength: 80
          minLength: 1
          type: string
      required:
        - name
        - group
        - masks
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          nullable: true
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          example: https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          example: 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          example: Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          example: https://example.com/errors/example
          format: uri
          type: string
      type: object
    Exit:
      additionalProperties: false
      properties:
        available:
          type: boolean
        id:
          type: string
      required:
        - id
        - available
      type: object
    ExitGroupAssignment:
      additionalProperties: false
      properties:
        group:
          type: string
        id:
          type: string
        priority:
          format: int64
          minimum: 1
          type: integer
      required:
        - id
        - group
        - priority
      type: object
    ExitGroupChange:
      additionalProperties: false
      properties:
        expectedGroup:
          maxLength: 63
          minLength: 1
          pattern: ^[a-z][a-z0-9-]{0,62}$
          type: string
        group:
          maxLength: 63
          minLength: 1
          pattern: ^[a-z][a-z0-9-]{0,62}$
          type: string
        priority:
          format: int64
          minimum: 1
          type: integer
      required:
        - expectedGroup
        - group
        - priority
      type: object
    Group:
      additionalProperties: false
      properties:
        exits:
          items:
            $ref: "#/components/schemas/Exit"
          type: array
        id:
          type: string
        isDefault:
          type: boolean
        name:
          type: string
      required:
        - id
        - isDefault
        - exits
      type: object
    GroupCreateRequest:
      additionalProperties: false
      properties:
        id:
          maxLength: 63
          minLength: 1
          pattern: ^[a-z][a-z0-9-]{0,62}$
          type: string
        name:
          maxLength: 80
          minLength: 1
          type: string
      type: object
    GroupIdentifier:
      additionalProperties: false
      properties:
        id:
          maxLength: 63
          minLength: 1
          pattern: ^[a-z][a-z0-9-]{0,62}$
          type: string
        name:
          type: string
      required:
        - id
      type: object
    GroupName:
      additionalProperties: false
      properties:
        name:
          maxLength: 80
          minLength: 1
          type: string
      required:
        - name
      type: object
    GroupOrderChange:
      additionalProperties: false
      properties:
        expected:
          items:
            $ref: "#/components/schemas/OrderedGroup"
          minItems: 1
          type: array
        groups:
          items:
            $ref: "#/components/schemas/OrderedGroup"
          minItems: 1
          type: array
      required:
        - expected
        - groups
      type: object
    Navigation:
      additionalProperties: false
      properties:
        grafanaUrl:
          description: Адрес Grafana по HTTPS или пустая строка, если интеграция выключена
          type: string
      required:
        - grafanaUrl
      type: object
    OrderedGroup:
      additionalProperties: false
      properties:
        exits:
          items:
            type: string
          type: array
        id:
          minLength: 1
          type: string
      required:
        - id
        - exits
      type: object
    PhysicalInterface:
      additionalProperties: false
      properties:
        exitIds:
          items:
            type: string
          type: array
        interfaceName:
          maxLength: 15
          minLength: 1
          type: string
        kind:
          enum:
            - ethernet
            - wifi
          type: string
        online:
          type: boolean
        present:
          type: boolean
      required:
        - interfaceName
        - kind
        - present
        - online
        - exitIds
      type: object
    PhysicalInventory:
      additionalProperties: false
      properties:
        interfaces:
          items:
            $ref: "#/components/schemas/PhysicalInterface"
          type: array
        wifiAvailable:
          type: boolean
        wifiProfiles:
          items:
            $ref: "#/components/schemas/WifiConnection"
          type: array
      required:
        - interfaces
        - wifiProfiles
        - wifiAvailable
      type: object
    Policy:
      additionalProperties: false
      properties:
        exclusions:
          items:
            type: string
          maxItems: 4096
          type: array
        manual:
          items:
            type: string
          maxItems: 4096
          type: array
        settings:
          $ref: "#/components/schemas/DNSSettings"
      required:
        - settings
        - manual
        - exclusions
      type: object
    QualityCheck:
      additionalProperties: false
      properties:
        dnsName:
          maxLength: 253
          type: string
        intervalSeconds:
          format: int64
          maximum: 3600
          minimum: 1
          type: integer
        protocol:
          enum:
            - UDP
            - TCP
            - ICMP
            - DNS
            - HTTPS
            - HTTP3
          type: string
        requestPath:
          description: Путь запроса на сервере, включая необязательную строку параметров.
          maxLength: 1024
          type: string
        serverName:
          description: Имя сервера для TLS и HTTP.
          maxLength: 253
          type: string
        targets:
          items:
            type: string
          maxItems: 8
          minItems: 1
          type: array
        timeoutSeconds:
          format: int64
          maximum: 30
          minimum: 1
          type: integer
      required:
        - protocol
        - targets
        - intervalSeconds
        - timeoutSeconds
      type: object
    QualityConnection:
      additionalProperties: false
      properties:
        active:
          description: Выход подтверждён действующим селектором группы
          type: boolean
        available:
          type: boolean
        id:
          type: string
        result:
          $ref: "#/components/schemas/Result"
      required:
        - id
        - available
        - active
        - result
      type: object
    QualityGroup:
      additionalProperties: false
      properties:
        connections:
          items:
            $ref: "#/components/schemas/QualityConnection"
          type: array
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
        - connections
      type: object
    QualityReport:
      additionalProperties: false
      properties:
        capturedAt:
          description: Время снимка RFC 3339. Пусто до получения актуального отчёта от контроллера.
          type: string
        groups:
          items:
            $ref: "#/components/schemas/QualityGroup"
          type: array
        settings:
          $ref: "#/components/schemas/QualitySettings"
      required:
        - capturedAt
        - settings
        - groups
      type: object
    QualitySettings:
      additionalProperties: false
      properties:
        checks:
          items:
            $ref: "#/components/schemas/QualityCheck"
          maxItems: 6
          minItems: 0
          type: array
        windowMinutes:
          format: int64
          maximum: 1440
          minimum: 1
          type: integer
      required:
        - windowMinutes
        - checks
      type: object
    QualityWindow:
      additionalProperties: false
      properties:
        windowMinutes:
          format: int64
          maximum: 1440
          minimum: 1
          type: integer
      required:
        - windowMinutes
      type: object
    Result:
      additionalProperties: false
      properties:
        checks:
          items:
            $ref: "#/components/schemas/CheckResult"
          type: array
        overall:
          format: double
          nullable: true
          type: number
      required:
        - checks
        - overall
      type: object
    RuleList:
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        group:
          description: Пустая строка означает отсутствие привязки
          type: string
        id:
          type: string
        masks:
          items:
            type: string
          type: array
        name:
          type: string
      required:
        - id
        - group
        - enabled
        - masks
      type: object
    Snapshot:
      additionalProperties: false
      properties:
        groups:
          items:
            $ref: "#/components/schemas/Group"
          type: array
        lists:
          items:
            $ref: "#/components/schemas/RuleList"
          type: array
      required:
        - groups
        - lists
      type: object
    TargetResult:
      additionalProperties: false
      properties:
        dnsErrors:
          format: int64
          type: integer
        dnsResponseCodes:
          additionalProperties:
            format: int64
            type: integer
          description: Число полученных ответов с ненулевым кодом DNS, ключ — десятичный RCODE.
          type: object
        localErrors:
          format: int64
          type: integer
        samples:
          format: int64
          type: integer
        score:
          format: double
          nullable: true
          type: number
        successes:
          format: int64
          type: integer
        target:
          type: string
      required:
        - target
        - samples
        - successes
        - localErrors
        - dnsErrors
        - score
      type: object
    TrafficEvent:
      additionalProperties: false
      properties:
        address:
          type: string
        blockReason:
          type: string
        connection:
          type: string
        dnsQueryId:
          type: string
        domain:
          type: string
        fakeIP:
          type: string
        firstReplyMs:
          format: int64
          type: integer
        group:
          type: string
        id:
          type: string
        kind:
          enum:
            - observed
            - unconfirmed
            - blocked
          type: string
        namespace:
          type: string
        networkInterface:
          type: string
        port:
          format: int64
          maximum: 65535
          minimum: 0
          type: integer
        protocol:
          enum:
            - TCP
            - UDP
          type: string
        reason:
          type: string
        time:
          format: date-time
          type: string
      required:
        - id
        - time
        - protocol
        - address
        - port
        - kind
      type: object
    TrafficPage:
      additionalProperties: false
      properties:
        events:
          items:
            $ref: "#/components/schemas/TrafficEvent"
          type: array
        lastInterruption:
          description: Время последнего обнаруженного разрыва подписки на трафик (UTC); число пропущенных в этот период потоков неизвестно
          format: date-time
          type: string
        lost:
          format: int64
          type: integer
        outputs:
          items:
            type: string
          type: array
        snapshot:
          type: string
        sourceAvailable:
          type: boolean
        total:
          format: int64
          type: integer
      required:
        - events
        - total
        - outputs
        - snapshot
        - lost
        - sourceAvailable
      type: object
    TrafficSettings:
      additionalProperties: false
      properties:
        maxMB:
          description: Лимит файла журнала в мегабайтах (1 МБ = 1048576 байт)
          format: int64
          maximum: 1048576
          minimum: 1
          type: integer
        retentionHours:
          description: Срок хранения от времени события в часах
          format: int64
          maximum: 87600
          minimum: 1
          type: integer
      required:
        - maxMB
        - retentionHours
      type: object
    TrafficSettingsChange:
      additionalProperties: false
      properties:
        expected:
          $ref: "#/components/schemas/TrafficSettings"
          description: Настройки, прочитанные при открытии формы
        proposed:
          $ref: "#/components/schemas/TrafficSettings"
          description: Новые значения, подтверждённые оператором
      required:
        - expected
        - proposed
      type: object
    WifiConnection:
      additionalProperties: false
      properties:
        active:
          type: boolean
        band:
          enum:
            - "2.4"
            - "5"
          type: string
        id:
          type: string
        interfaceName:
          type: string
        security:
          enum:
            - open
            - wpa-psk
          type: string
        ssid:
          type: string
      required:
        - id
        - interfaceName
        - ssid
        - security
        - band
        - active
      type: object
    WifiConnectionSettings:
      additionalProperties: false
      properties:
        band:
          enum:
            - "2.4"
            - "5"
          type: string
        interfaceName:
          maxLength: 15
          minLength: 1
          type: string
        password:
          maxLength: 64
          type: string
          writeOnly: true
        security:
          enum:
            - open
            - wpa-psk
          type: string
        ssid:
          maxLength: 32
          minLength: 1
          type: string
      required:
        - interfaceName
        - ssid
        - security
        - band
      type: object
info:
  title: Локальная панель Гестии
  version: 1.0.0
openapi: 3.0.3
paths:
  /api/awg:
    get:
      operationId: listAWGConnections
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/AWGConnection"
                type: array
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Прочитать подключения AmneziaWG без секретных данных
      tags:
        - Panel
    post:
      operationId: createAWGConnection
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AWGSaveRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AWGConnection"
          description: OK
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Request Entity Too Large
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Сохранить профиль AmneziaWG и назначение группе
      tags:
        - Panel
  /api/awg-underlays:
    get:
      operationId: listAWGUnderlays
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/AWGUnderlayCandidate"
                type: array
          description: OK
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Получить подключения для транспорта WireGuard
      tags:
        - Panel
  /api/awg/check:
    post:
      operationId: checkAWGProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AWGCheckRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AWGCheckResult"
          description: OK
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Request Entity Too Large
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
