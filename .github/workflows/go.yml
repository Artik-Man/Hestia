name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install shell tools
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.11.0
          python3 -m venv "$RUNNER_TEMP/hestia-shellcheck"
          "$RUNNER_TEMP/hestia-shellcheck/bin/pip" install shellcheck-py==0.11.0.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/hestia-shellcheck/bin" >> "$GITHUB_PATH"
      - run: make check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: make -C .. generate-api
      - name: Verify generated contract and Angular client
        run: |
          git diff --exit-code -- ../api/openapi.yaml src/api/generated
          test -z "$(git ls-files --others --exclude-standard -- ../api/openapi.yaml src/api/generated)"
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
