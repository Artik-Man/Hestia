name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install shell tools
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.11.0
          python3 -m venv "$RUNNER_TEMP/hestia-shellcheck"
          "$RUNNER_TEMP/hestia-shellcheck/bin/pip" install shellcheck-py==0.11.0.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/hestia-shellcheck/bin" >> "$GITHUB_PATH"
      - name: Install experiment test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/hestia-experiment-tests"
          "$RUNNER_TEMP/hestia-experiment-tests/bin/python" -m pip install --require-hashes --only-binary=:all: -r experiments/requirements-test.txt
          echo "$RUNNER_TEMP/hestia-experiment-tests/bin" >> "$GITHUB_PATH"
      - run: make build
      - name: Verify that other platforms have no gateway commands
        run: |
          for target in darwin/arm64 linux/amd64 linux/arm android/arm64; do
            packages=$(GOOS="${target%/*}" GOARCH="${target#*/}" go -C backend list ./cmd/...)
            test -z "$packages"
          done
      - run: make check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: make -C .. generate-api
      - name: Verify generated contract and Angular client
        run: |
          git diff --exit-code -- ../backend/api/openapi.yaml src/core/services/api/generated
          test -z "$(git ls-files --others --exclude-standard -- ../backend/api/openapi.yaml src/core/services/api/generated)"
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install pinned Chromium and Linux browser dependencies
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser
